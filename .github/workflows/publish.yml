name: Publish Angular UI Library

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@luongquochung1995'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check environment
        run: |
          node -v
          npm -v

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Point lockfile to public npm registry
        run: sed -i 's#http://10.60.129.132/repository/npm-proxy/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Publish package
        working-directory: dist/ui-library
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}