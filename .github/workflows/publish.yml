name: Publish Angular UI Library

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: '@luongquochung1995'

      - name: Update npm
        run: |
          npm install --global npm@10
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --verbose

      - name: Build UI Library
        run: npx ng build ui-library --configuration production

      - name: Verify package
        run: |
          ls -la dist/ui-library
          cat dist/ui-library/package.json

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist/ui-library
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}